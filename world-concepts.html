<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Moth and the Mouth: world mood frames</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #cfc8d8; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #stage canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 9; }
      #caption { position: absolute; left: 16px; bottom: 14px; max-width: 760px; opacity: 0.72; pointer-events: none; }
      #caption b { display: block; font: 600 15px Georgia, serif; color: #efe6f2; letter-spacing: 0.02em; }
      #caption span { display: block; margin-top: 2px; }
      #caption i { display: block; margin-top: 4px; opacity: 0.6; font-style: normal; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption"></div>
    <script type="module" src="/src/world-concepts/main.ts"></script>
  </body>
</html>
