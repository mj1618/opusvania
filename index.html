<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opusvania</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020a0e;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The canvas is sized by src/render/app.ts: 16:9, letterboxed, full device resolution. */
      #app canvas {
        display: block;
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #8890a4;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }
      #hint.quiet {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">arrows/WASD move · Z/Space jump (again in air: somersault · hold while falling: glide) · X/Shift dash · C attack (with ↑ or ↓ · ↓ on a target bounces) · V/F give a glint (calms a creature · into a lantern or the heart) · R restart · <span id="sound-key">M sound</span> · H keys</div>
    <script>
      // The key legend shows at start, fades once the player has been playing a while, and returns on H.
      (() => {
        const hint = document.getElementById('hint');
        let quietTimer = 0;
        const quietSoon = () => {
          clearTimeout(quietTimer);
          quietTimer = setTimeout(() => hint.classList.add('quiet'), 12000);
        };
        let started = false;
        addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            hint.classList.remove('quiet');
            quietSoon();
            return;
          }
          if (!started) {
            started = true;
            quietSoon();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
