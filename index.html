<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opusvania</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 1920x1080 canvas, letterboxed to fit the window. */
      #app canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: auto;
        aspect-ratio: 16 / 9;
        display: block;
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #8890a4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">Opusvania · movement gym · arrows/WASD move · Z/Space jump · X/Shift dash (Slip) · C jab (Down+C pogo) · V seize · B levy · Up enters doors · 1-0 / Shift+1-4 rooms · H hub · F2 hitboxes · F3 blind A/B · ` tuning</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
