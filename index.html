<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opusvania</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020a0e;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The canvas is sized by src/render/app.ts: 16:9, letterboxed, full device resolution. */
      #app canvas {
        display: block;
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #8890a4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">arrows/WASD move · Z/Space jump · X/Shift dash · C attack · F2 collision · ` tuning · R restart</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
